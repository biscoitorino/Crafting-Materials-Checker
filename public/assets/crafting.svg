<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a251d"/><stop offset="1" stop-color="#12100c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#d99a1e"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d4c7"/><stop offset="1" stop-color="#7d7669"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#f6c344" stroke-width="8"/>
  <!-- gil coin -->
  <circle cx="164" cy="160" r="58" fill="url(#coin)" stroke="#8a5d0c" stroke-width="6"/>
  <circle cx="164" cy="160" r="42" fill="none" stroke="#8a5d0c" stroke-width="4" opacity=".6"/>
  <text x="164" y="178" font-family="Georgia, serif" font-size="54" font-weight="bold" text-anchor="middle" fill="#8a5d0c">G</text>
  <!-- hammer -->
  <g transform="rotate(-40 100 100)">
    <rect x="92" y="70" width="18" height="130" rx="6" fill="#8b5a2b" stroke="#4a2e12" stroke-width="4"/>
    <rect x="52" y="34" width="98" height="46" rx="10" fill="url(#steel)" stroke="#3a362f" stroke-width="5"/>
    <rect x="60" y="42" width="30" height="8" rx="4" fill="#fff" opacity=".45"/>
  </g>
</svg>
